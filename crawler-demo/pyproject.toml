[project]
name = "crawler-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "iris", email = "shiyangchen24@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pandas>=3.1.0",
    "requests>=2.34.2",
]

[project.scripts]
crawler-demo = "crawler_demo:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
